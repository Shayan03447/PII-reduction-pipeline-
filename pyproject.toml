[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag_pipeline"
version = "0.1.0"
description = "PII-safe data pipeline for RAG and agent for a support knowledge assistant"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.12",
    "faker>=25",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "pre-commit>=3",    
]

# Phase 9
# [project.scripts]
# rag = "rag_platform.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_platform"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"